 
services:
  # @TODO:Code Serverの追加。VSCodeベースのWeb IDE。プロジェクトのコード編集に使用
  #. 特徴: VSCodeベースのWeb IDE。プロジェクトのコード編集に使用。GitHub Codespacesと同様の操作感で、ブラウザ上で快適にコード編集が可能です。
  #. 参考: https://qiita.com/plumchang/items/2229bda056d0f1ef3434
  # @TODO:Uptime Kumaの追加。docker-composeサービスとprojects配下の死活監視に使用
  # @TODO:Headroomの追加。有料モデルを使用する場合のトークン数圧縮に使用
  # @TODO:Kali Linuxの追加。ペネトレーションテストに使用
  scrumblr:
    build:
      context: ../services/scrumblr
      dockerfile: Dockerfile
      args:
        REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6379}}
        SCRUMBLR_PORT: ${SCRUMBLR_PORT:-8080}
    ports :
      - "13030:${SCRUMBLR_PORT:-8080}"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6379}}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "16379:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data

  postgres:
    build:
      context: ../services/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musuhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musuhi}
      POSTGRES_MUSUHI_DB: ${POSTGRES_MUSUHI_DB:-musuhi}
      POSTGRES_MUSUHI_SCHEMA: ${POSTGRES_MUSUHI_SCHEMA:-musuhi}
      POSTGRES_FORGEJO_DB: ${POSTGRES_FORGEJO_DB:-forgejo}
      POSTGRES_FORGEJO_SCHEMA: ${POSTGRES_FORGEJO_SCHEMA:-forgejo}
    ports:
      - "15432:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/postgres/00_initdb-forgejo.sh:/docker-entrypoint-initdb.d/00_initdb-forgejo.sh:ro
      - ../services/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MUSUHI_USER:-musuhi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:${OLLAMA_PORT:-11434}
    entrypoint: ["/bin/sh", "/scripts/ollama-model-pull.sh"]
    volumes:
      - ./scripts/ollama-model-pull.sh:/scripts/ollama-model-pull.sh:ro
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "${LITELLM_HOST_PORT:-14000}:4000"
    volumes:
      - ./scripts/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hermes Agent。AIエージェント管理ツール。タスク管理やエージェントのモニタリングに使用
  #. 特徴: AIエージェント管理ツール。タスク管理やエージェントのモニタリングに使用。複数のAIエージェントを一元管理でき、タスクの進行状況やエージェントのパフォーマンスをリアルタイムで監視できます。
  #. 参考: https://hermesagent.com/
  #.      https://qiita.com/kai_kou/items/c4ba4c6dfd0342634a78
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "${HERMES_HOST_PORT:-18642}:8642"
      - "${HERMES_DASHBOARD_HOST_PORT:-19119}:9119"
    environment:
      HERMES_DASHBOARD: 1
      # HERMES_UID / HERMES_GID はホストUID/GIDに合わせたい場合のみ指定する
      # HERMES_UID: ${HERMES_UID:-}
      # HERMES_GID: ${HERMES_GID:-}
    volumes:
      - hermes_data:/opt/data
      - ./scripts/hermes/config.yaml:/opt/data/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy

  musuhi-api:
    build:
      context: ../services/musuhi-api
      dockerfile: Dockerfile
      args:
          - DATABASE_URL=postgres://${POSTGRES_USER:-musuhi}:${POSTGRES_PASSWORD:-musuhi}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_MUSUHI_DB:-musuhi}
          - FORGEJO_URL=${FORGEJO_URL:-http://forgejo:${FORGEJO_PORT:-3000}}
          - MUSUHI_LLM_ENDPOINT=${MUSUHI_LLM_ENDPOINT:-http://litellm:4000/v1}
          - FORGEJO_USER=${FORGEJO_USER:-musuhi}
          - FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-musuhi}
          - FORGEJO_EMAIL=${FORGEJO_EMAIL:-musuhi@example.com}
          - MUSUHI_API_PORT=${MUSUHI_API_PORT:-8080}
    ports:
      - "${MUSUHI_API_HOSTSIDE_PORT:-18080}:${MUSUHI_API_PORT:-8080}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-musuhi}:${POSTGRES_PASSWORD:-musuhi}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_MUSUHI_DB:-musuhi}
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:${FORGEJO_PORT:-3000}}
      FORGEJO_TOKEN_PATH: ${FORGEJO_TOKEN_PATH:-/shared/forgejo_token/token.txt}
      MUSUHI_LLM_ENDPOINT: ${MUSUHI_LLM_ENDPOINT:-http://litellm:4000/v1}
      MUSUHI_LLM_API_KEY: ""
      MUSUHI_LLM_PROFILE: balanced
      MUSUHI_LLM_MODEL_FAST: qwen2.5:3b-instruct
      MUSUHI_LLM_MODEL_BALANCED: qwen2.5:3b-instruct
      MUSUHI_LLM_MODEL_QUALITY: qwen2.5:7b-instruct
    depends_on:
      forgejo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      forgejo-init:
        condition: service_completed_successfully
    volumes:
      - ../../projects:/app/projects
      - forgejo_token:/shared/forgejo_token

  musuhi-frontend:
    build:
      context: ../services/musuhi-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${MUSUHI_API_HOSTSIDE_PORT:-18080}
    ports:
      - "13000:${MUSUHI_FRONTEND_PORT:-3000}"
    environment:
      VITE_API_BASE_URL: http://localhost:${MUSUHI_API_HOSTSIDE_PORT:-18080}
      PORT: ${MUSUHI_FRONTEND_PORT:-3000}
    depends_on:
      - musuhi-api

  forgejo:
    build:
      context: ../services/forgejo
      dockerfile: Dockerfile
    ports:
      - "13031:${FORGEJO_PORT:-3000}"   # Web UI
      - "13032:22"     # SSH (optional)
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:${POSTGRES_PORT:-5432}
      - FORGEJO__database__NAME=${POSTGRES_FORGEJO_DB:-forgejo}
      - FORGEJO__database__USER=${POSTGRES_USER:-musuhi}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD:-musuhi}
      - FORGEJO__database__SCHEMA=${POSTGRES_FORGEJO_SCHEMA:-forgejo}
      - FORGEJO__log__ROOT_PATH=/data/forgejo/log
      - FORGEJO__security__INSTALL_LOCK=true
      # 初回セットアップ画面を有効化
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:13031/
      - FORGEJO__server__SSH_DOMAIN=localhost
      - FORGEJO__server__SSH_PORT=13032
      - FORGEJO_APP_INI=/data/forgejo/conf/app.ini
      - FORGEJO_TOKEN_PATH=${FORGEJO_TOKEN_PATH:-/shared/forgejo_token/token.txt}
    volumes:
      - forgejo_data:/data
      - ../services/forgejo/conf/app.ini:/etc/gitea/app.ini
      - ../../services/forgejo/log:/data/forgejo/log
      - forgejo_token:/shared/forgejo_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FORGEJO_PORT:-3000}/" ]
      interval: 30s
      timeout: 10s
      retries: 5

  forgejo-init:
    image: codeberg.org/forgejo/forgejo:15
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - forgejo_data:/data
      - forgejo_token:/shared/forgejo_token
      - ./scripts/forgejo-init.sh:/scripts/forgejo-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/forgejo-init.sh"]
    restart: "no"
volumes:
  postgres_data:
  ollama_data:
  redis_data:
  hermes_data:
  forgejo_data:
  forgejo_token: