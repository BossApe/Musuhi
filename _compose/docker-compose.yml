 
services:
  # @TODO:Code Serverの追加。VSCodeベースのWeb IDE。プロジェクトのコード編集に使用
  #. 特徴: プロジェクトのコード編集に使用。GitHub Codespacesと同様の操作感で、ブラウザ上で快適にコード編集が可能。
  #. 参考: https://qiita.com/plumchang/items/2229bda056d0f1ef3434
  # @TODO:Uptime Kumaの追加。docker-composeサービスとprojects配下の死活監視に使用
  # @TODO:Headroomの追加。有料モデルを使用する場合のトークン数圧縮に使用
  # @TODO:Kali Linuxの追加。ペネトレーションテストに使用
  #scrumblr:
  #  build:
  #    context: ../services/scrumblr
  #    dockerfile: Dockerfile
  #    args:
  #      REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6379}}
  #      SCRUMBLR_PORT: ${SCRUMBLR_PORT:-8080}
  #  container_name: scrumblr
  #  ports :
  #    - "13030:${SCRUMBLR_PORT:-8080}"
  #  environment:
  #    REDIS_HOST: redis
  #    REDIS_PORT: ${REDIS_PORT:-6379}
  #    REDIS_URL: ${REDIS_URL:-redis://redis:${REDIS_PORT:-6379}}
  #  depends_on:
  #    - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "16379:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data

  postgres:
    build:
      context: ../services/postgres
      dockerfile: Dockerfile
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musuhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musuhi}
      POSTGRES_MUSUHI_DB: ${POSTGRES_MUSUHI_DB:-musuhi}
      POSTGRES_MUSUHI_SCHEMA: ${POSTGRES_MUSUHI_SCHEMA:-musuhi}
      POSTGRES_FORGEJO_DB: ${POSTGRES_FORGEJO_DB:-forgejo}
      POSTGRES_FORGEJO_SCHEMA: ${POSTGRES_FORGEJO_SCHEMA:-forgejo}
    ports:
      - "15432:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/postgres/00_initdb-forgejo.sh:/docker-entrypoint-initdb.d/00_initdb-forgejo.sh:ro
      - ../services/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MUSUHI_USER:-musuhi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama。LLM管理プラットフォーム。LLMのホスティングとAPI提供に使用
  #. 特徴: OSSのLLMのホスティングとAPI提供に使用。複数のLLMを同時に管理でき、APIベースでアクセス可能。軽量で高速なLLMサーバーで、複数のLLMを同時に管理でき、APIベースでアクセス可能。
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"
    environment:
      # Bind on all interfaces so sibling containers can reach ollama via service DNS.
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_PORT:-11434}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: ollama-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:${OLLAMA_PORT:-11434}
    entrypoint: ["/bin/sh", "/scripts/ollama-model-pull.sh"]
    volumes:
      - ./scripts/ollama-model-pull.sh:/scripts/ollama-model-pull.sh:ro
    restart: "no"

  # litellm。軽量LLMサーバー。LLMのAPIエンドポイントを提供
  #. 複数のLLMを同時に管理でき、APIベースでアクセス可能。軽量で高速なLLMサーバーで、複数のLLMを同時に管理でき、APIベースでアクセス可能。Hermes AgentやMusuhi APIからのLLMリクエストを処理する。
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "${LITELLM_PORT:-4000}", "--host", "0.0.0.0"]
    ports:
      - "${LITELLM_HOST_PORT:-14000}:${LITELLM_PORT:-4000}"
    volumes:
      - ../services/litellm/config.yaml:/app/config.yaml:ro
    environment:
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os, socket; p=int(os.getenv('LITELLM_PORT','4000')); s=socket.create_connection(('127.0.0.1', p), 5); s.close()",
        ]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s

  # Hermes Agent。AIエージェント管理ツール。タスク管理やエージェントのモニタリングに使用
  #. 複数のAIエージェントを一元管理でき、タスクの進行状況やエージェントのパフォーマンスをリアルタイムで監視できる。
  #. 参考: https://hermesagent.com/
  #.      https://qiita.com/kai_kou/items/c4ba4c6dfd0342634a78
  hermes:
    build:
      context: ../services/hermes
      dockerfile: Dockerfile
      args:
        LITELLM_PORT: ${LITELLM_PORT:-4000}
    container_name: hermes
    restart: unless-stopped
    ports:
      - "${HERMES_HOST_PORT:-18642}:${HERMES_PORT:-8642}"
      - "${HERMES_DASHBOARD_HOST_PORT:-19119}:${HERMES_DASHBOARD_PORT:-9119}"
    environment:
      HERMES_PORT: ${HERMES_PORT:-8642}
      HERMES_LANGUAGE: ja
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-musuhi}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-musuhi}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-MUSUHI_DASH_SECRET_20260608_ROTATED}
      # HERMES_UID / HERMES_GID はホストUID/GIDに合わせたい場合のみ指定する
      # HERMES_UID: ${HERMES_UID:-}
      # HERMES_GID: ${HERMES_GID:-}
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      litellm:
        condition: service_healthy

  musuhi-api:
    build:
      context: ../services/musuhi-api
      dockerfile: Dockerfile
      args:
          - DATABASE_URL=postgres://${POSTGRES_USER:-musuhi}:${POSTGRES_PASSWORD:-musuhi}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_MUSUHI_DB:-musuhi}
          - FORGEJO_URL=${FORGEJO_URL:-http://forgejo:${FORGEJO_PORT:-3000}}
          - MUSUHI_LLM_ENDPOINT=${MUSUHI_LLM_ENDPOINT:-http://litellm:${LITELLM_PORT:-4000}/v1}
          - FORGEJO_USER=${FORGEJO_USER:-musuhi}
          - FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-musuhi}
          - FORGEJO_EMAIL=${FORGEJO_EMAIL:-musuhi@example.com}
          - MUSUHI_API_PORT=${MUSUHI_API_PORT:-8080}
    container_name: musuhi-api
    ports:
      - "${MUSUHI_API_HOSTSIDE_PORT:-18080}:${MUSUHI_API_PORT:-8080}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-musuhi}:${POSTGRES_PASSWORD:-musuhi}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_MUSUHI_DB:-musuhi}
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:${FORGEJO_PORT:-3000}}
      FORGEJO_TOKEN_PATH: ${FORGEJO_TOKEN_PATH:-/shared/forgejo_token/token.txt}
      MUSUHI_LLM_ENDPOINT: ${MUSUHI_LLM_ENDPOINT:-http://litellm:${LITELLM_PORT:-4000}/v1}
      MUSUHI_LLM_API_KEY: ""
      MUSUHI_LLM_PROFILE: balanced
      MUSUHI_LLM_MODEL_FAST: musuhi-fast
      MUSUHI_LLM_MODEL_BALANCED: musuhi-balanced
      MUSUHI_LLM_MODEL_QUALITY: musuhi-quality
    depends_on:
      forgejo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      forgejo-init:
        condition: service_completed_successfully
    volumes:
      - ../../projects:/app/projects
      - forgejo_token:/shared/forgejo_token

  musuhi-frontend:
    build:
      context: ../services/musuhi-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${MUSUHI_API_HOSTSIDE_PORT:-18080}
    container_name: musuhi-frontend
    ports:
      - "13000:${MUSUHI_FRONTEND_PORT:-3000}"
    environment:
      VITE_API_BASE_URL: http://localhost:${MUSUHI_API_HOSTSIDE_PORT:-18080}
      PORT: ${MUSUHI_FRONTEND_PORT:-3000}
    depends_on:
      - musuhi-api

  forgejo:
    build:
      context: ../services/forgejo
      dockerfile: Dockerfile
    container_name: forgejo
    ports:
      - "13031:${FORGEJO_PORT:-3000}"   # Web UI
      - "13032:22"     # SSH (optional)
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:${POSTGRES_PORT:-5432}
      - FORGEJO__database__NAME=${POSTGRES_FORGEJO_DB:-forgejo}
      - FORGEJO__database__USER=${POSTGRES_USER:-musuhi}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD:-musuhi}
      - FORGEJO__database__SCHEMA=${POSTGRES_FORGEJO_SCHEMA:-forgejo}
      - FORGEJO__log__ROOT_PATH=/data/forgejo/log
      - FORGEJO__security__INSTALL_LOCK=true
      # 初回セットアップ画面を有効化
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:13031/
      - FORGEJO__server__SSH_DOMAIN=localhost
      - FORGEJO__server__SSH_PORT=13032
      - FORGEJO_APP_INI=/data/forgejo/conf/app.ini
      - FORGEJO_TOKEN_PATH=${FORGEJO_TOKEN_PATH:-/shared/forgejo_token/token.txt}
    volumes:
      - forgejo_data:/data
      - ../services/forgejo/conf/app.ini:/etc/gitea/app.ini
      - ../../services/forgejo/log:/data/forgejo/log
      - forgejo_token:/shared/forgejo_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FORGEJO_PORT:-3000}/" ]
      interval: 30s
      timeout: 10s
      retries: 5

  forgejo-init:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo-init
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - forgejo_data:/data
      - forgejo_token:/shared/forgejo_token
      - ./scripts/forgejo-init.sh:/scripts/forgejo-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/forgejo-init.sh"]
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  hermes_data:
  forgejo_data:
  forgejo_token: